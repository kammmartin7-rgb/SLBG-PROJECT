name: Verify packaged clients
on: workflow_call
permissions:
  contents: read
  actions: read
jobs:
  android-device:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 35]
    env:
      IMAGE: system-images;android-${{ matrix.api }};google_apis;x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: yachiyo-claw-debug-*
          merge-multiple: true
      - name: Install and open the built APK on the emulator
        shell: bash
        run: |
          set -euo pipefail
          test -s app-debug.apk
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          sudo chmod a+rw /dev/kvm
          "$sdk/sdkmanager" 'emulator' "$IMAGE"
          echo no | "$sdk/avdmanager" create avd -n verify -k "$IMAGE"
          "$ANDROID_HOME/emulator/emulator" -avd verify -no-window -no-audio -no-snapshot -gpu swiftshader_indirect >/tmp/emulator.log 2>&1 &
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]]; do sleep 2; done'
          adb install -t app-debug.apk
          adb shell am start -W -n io.github.yachiyoclaw/.MainActivity
          sleep 10
          adb shell pidof io.github.yachiyoclaw
          adb shell dumpsys activity activities | grep -E '(mResumedActivity|topResumedActivity).*io.github.yachiyoclaw'
  intel-mac-math:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise the desktop Python tools with their real dependencies
        run: |
          python -m pip install --only-binary=:all: sympy==1.14.0 networkx==3.5 z3-solver==4.13.4.0
          python - <<'PY'
          import sys
          sys.path.insert(0, 'desktop')
          import z3
          from discrete import calculate
          assert calculate('factor_polynomial', {'coefficients':[1,0,-1]}) == '(x - 1)*(x + 1)'
          assert calculate('shortest_path', {'edges':[['A','B'],['B','C']], 'start':'A','end':'C'}) == ['A','B','C']
          assert calculate('integer_solution', {'equations':[[1,1,7],[1,-1,1]]}) == {'status':'sat','x':4,'y':3}
          print('Passed all three operations, Z3', z3.get_version_string())
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Build Intel Mac app with offline mathematics
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          node <<'JS'
          const { startPair,checkPair }=require('./desktop/paired-agent.cjs')
          async function check() {
            const pair=await startPair('verification-profile',async()=> '42')
            try { await checkPair(pair,'verification-profile') }
            finally { pair.close() }
          }
          check().catch(e=>{console.error(e);process.exitCode=1})
          JS
          pnpm generate:routes
          pnpm build:web
          python -m pip download --only-binary=:all: -d .cache/math-wheels sympy==1.14.0 networkx==3.5 z3-solver==4.13.4.0
          npm install --prefix .tools/desktop @electron/packager@20.3.0
          bash scripts/package-macos.sh
          app="dist/desktop/Hacker Tool-darwin-x64/Hacker Tool.app"
          python -m venv /tmp/yachiyo-offline-math
          /tmp/yachiyo-offline-math/bin/python -I "$app/Contents/Resources/app.asar.unpacked/discrete.py" integer_solution '{"equations":[[1,1,7],[1,-1,1]]}' | grep -F '{"status": "sat", "x": 4, "y": 3}'
          ditto -c -k --keepParent "$app" Hacker-Tool-Intel.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hacker-Tool-Intel-Mac
          path: Hacker-Tool-Intel.zip
      - name: Exercise live documentation search from the Intel runner
        run: node scripts/check-macos-mcp.mjs "dist/desktop/Hacker Tool-darwin-x64/Hacker Tool.app"
  live-metis:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: node -e "require('./desktop/metis.cjs').metisBlock().then(r=>{ if(r.chainId!==1088 || BigInt(r.block)<1n) process.exit(1); console.log(r) }).catch(e=>{console.error(e.message);process.exit(1)})"
  isolated-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Exercise containerized desktop commands against a temporary workspace
        run: |
          test -x /usr/local/bin/docker || sudo ln -s "$(command -v docker)" /usr/local/bin/docker
          node <<'JS'
          const {runCode}=require('./desktop/code-workspace.cjs')
          const assert=require('node:assert/strict')
          async function execute(input) {
            const result=await runCode(process.env.RUNNER_TEMP,'ci',input,async()=>true)
            assert.equal(result.exitCode,0,result.stderr)
            return result.stdout.trim()
          }
          async function check() {
            await execute({language:'python',source:"open('verify.txt','w').write('42')"})
            assert.equal(await execute({language:'typescript',source:"import fs from 'node:fs'; const value: string = fs.readFileSync('verify.txt','utf8'); console.log(value)"}),'42')
            await execute({language:'git',args:['init']})
            assert.equal(await execute({language:'git',args:['status','--porcelain']}),'?? verify.txt')
          }
          check().catch(e=>{console.error(e);process.exitCode=1})
          JS
  n8n-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Discover and use a real n8n documentation tool through the desktop launcher
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          node <<'JS'
          const {approvedStdio}=require('./desktop/stdio-launcher.cjs')
          const {Client}=require('@modelcontextprotocol/sdk/client/index.js')
          const assert=require('node:assert/strict')
          async function check() {
            const client=new Client({name:'desktop-verification',version:'1'})
            const transport=await approvedStdio({command:'npx',args:['-y','n8n-mcp'],env:{MCP_MODE:'stdio',DISABLE_CONSOLE_OUTPUT:'true'}},async()=>true)
            try {
              await client.connect(transport)
              const {tools}=await client.listTools()
              assert(tools.some(t=>t.name==='search_nodes'))
              const result=await client.callTool({name:'search_nodes',arguments:{query:'webhook',limit:1}})
              assert(!result.isError && JSON.stringify(result.content).toLowerCase().includes('webhook'))
              console.log('n8n MCP returned webhook search results')
            } finally { await client.close() }
          }
          check().catch(e=>{console.error(e);process.exitCode=1})
          JS
